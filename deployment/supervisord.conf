[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work database --sleep=3 --tries=2 --timeout=5400
directory=/var/www/html
user=www-data
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=5500
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
